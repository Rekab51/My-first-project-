<!DOCTYPE html>
<html>
<head>
    <title>Mood to Activity</title>
</head>
<body>

    <h1>😊 Mood to Activity</h1>
    <p>How are you feeling today?</p>

    <button onclick="showActivity('happy')">😊 Happy</button>
    <button onclick="showActivity('sad')">😔 Sad</button>
    <button onclick="showActivity('tired')">😴 Tired</button>
    <button onclick="showActivity('angry')">😡 Angry</button>

    <h2 id="result"></h2>

    <script>
        function showActivity(mood) {
            let result = "";

            if (mood === "happy") {
                result = "Go for a walk and enjoy your day! 🌳";
            } else if (mood === "sad") {
                result = "Listen to your favorite song. 🎵";
            } else if (mood === "tired") {
                result = "Take some rest and drink water. 💧";
            } else if (mood === "angry") {
                result = "Take a deep breath and relax. 😌";
            }

            document.getElementById("result").innerText = result;
        }
    </script>

</body>
</html>
